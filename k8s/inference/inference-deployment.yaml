apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-demo-inference
  namespace: mlops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-demo-inference
  template:
    metadata:
      labels:
        app: mlops-demo-inference
    spec:
      containers:
        - name: inference
          image: ghcr.io/jrodriguezru/mlops-demo:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-demo-inference
  namespace: mlops
spec:
  selector:
    app: mlops-demo-inference
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mlops-demo-inference
  namespace: mlops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlops-demo-inference
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
